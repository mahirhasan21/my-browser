name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(ls *.zip | head -n1)
          echo "Using $ZIP"
          mkdir _dragon
          unzip -o -q "$ZIP" -d _dragon
          DIR=$(dirname "$(find _dragon -name settings.gradle | head -n1)")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Copy APK
        run: cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" DragonBrowser.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DragonBrowser-apk
          path: DragonBrowser.apk

      - name: Publish release (direct APK download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Dragon Browser v1.${{ github.run_number }}
          files: DragonBrowser.apk
